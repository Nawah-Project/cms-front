name: cms-front-dev

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development-dependencies-env
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${DEV_VITE_API_URL:-http://localhost:3001}
      VITE_CV_MAX_FILE_SIZE_BYTES: ${DEV_VITE_CV_MAX_FILE_SIZE_BYTES:-5242880}
    ports:
      - "127.0.0.1:${DEV_FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./vite.config.ts:/app/vite.config.ts
      - ./react-router.config.ts:/app/react-router.config.ts
