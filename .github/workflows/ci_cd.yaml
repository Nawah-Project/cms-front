name: CI and production deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: cms-front-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build development and production frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate development Compose file
        run: docker compose -f compose.dev.yml config --quiet

      - name: Build development frontend image
        run: docker compose -f compose.dev.yml build frontend

      - name: Build production frontend image
        run: docker build --build-arg VITE_API_URL=https://api.nawah-project.com -t cms-front:ci .

  deploy-production:
    name: Deploy frontend to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: cms-front-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PROD_SSH_PRIVATE_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Sync frontend source and deploy frontend only
        env:
          PROD_SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          test -n "$PROD_SERVER_HOST"
          test -n "$PROD_SERVER_USER"
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/.git/' \
            --exclude='/node_modules/' \
            --exclude='/build/' \
            --exclude='/.react-router/' \
            --exclude='/coverage/' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes' \
            ./ "$PROD_SERVER_USER@$PROD_SERVER_HOST:/data/cms-front/"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "$PROD_SERVER_USER@$PROD_SERVER_HOST" \
            'docker compose -f /data/cms-back/compose.yml up -d --build frontend && for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 2; done; docker compose -f /data/cms-back/compose.yml logs --tail=60 frontend; exit 1'
