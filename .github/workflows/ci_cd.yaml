name: CI and production deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: cms-front-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build development and production frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure ephemeral CI development frontend
        run: |
          cat > .env.ci <<EOF
          DEV_FRONTEND_HOST_PORT=5174
          DEV_VITE_API_URL=http://127.0.0.1:3302
          DEV_VITE_CV_MAX_FILE_SIZE_BYTES=5242880
          EOF

      - name: Validate development Compose file
        run: docker compose --env-file .env.ci -p cms-ci-front -f compose.dev.yml config --quiet

      - name: Build development frontend image
        run: docker compose --env-file .env.ci -p cms-ci-front -f compose.dev.yml build frontend

      - name: Start and smoke test development frontend
        run: |
          docker compose --env-file .env.ci -p cms-ci-front -f compose.dev.yml up -d frontend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5174/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.ci -p cms-ci-front -f compose.dev.yml logs frontend
          exit 1

      - name: Stop CI frontend stack
        if: always()
        run: docker compose --env-file .env.ci -p cms-ci-front -f compose.dev.yml down --remove-orphans --volumes

      - name: Build production frontend image
        run: docker build --build-arg VITE_API_URL=https://api.nawah-project.com -t cms-front:ci .

  deploy-production:
    name: Deploy frontend to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: cms-front-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check production runner access
        run: |
          test -w /data/cms-front
          docker compose version
          rsync --version

      - name: Sync frontend source and deploy frontend only
        run: |
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/.git/' \
            --exclude='/node_modules/' \
            --exclude='/build/' \
            --exclude='/.react-router/' \
            --exclude='/coverage/' \
            ./ /data/cms-front/
          docker compose -f /data/cms-back/compose.yml up -d --build frontend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f /data/cms-back/compose.yml logs --tail=60 frontend
          exit 1

  deploy-development:
    name: Deploy frontend to isolated development environment
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: cms-front-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check development deployment access
        run: |
          test -w /data/cms-development
          test -r /data/cms-development/.env
          docker compose version
          rsync --version

      - name: Sync frontend source and deploy development frontend only
        run: |
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/.git/' \
            --exclude='/node_modules/' \
            --exclude='/build/' \
            --exclude='/.react-router/' \
            --exclude='/coverage/' \
            ./ /data/cms-development/frontend/
          docker compose --project-name cms-development-frontend --env-file /data/cms-development/.env -f /data/cms-development/frontend/compose.dev.yml config --quiet
          docker compose --project-name cms-development-frontend --env-file /data/cms-development/.env -f /data/cms-development/frontend/compose.dev.yml up -d --build frontend
          frontend_endpoint="$(docker compose --project-name cms-development-frontend --env-file /data/cms-development/.env -f /data/cms-development/frontend/compose.dev.yml port frontend 5173)"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://${frontend_endpoint}/" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-name cms-development-frontend --env-file /data/cms-development/.env -f /data/cms-development/frontend/compose.dev.yml logs --tail=60 frontend
          exit 1
