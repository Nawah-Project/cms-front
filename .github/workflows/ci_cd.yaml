name: Hosted CI and release candidate
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_API_URL: https://api.nawah-project.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run typecheck
      - run: node --test scripts/*checks.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build standalone production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: nawah/frontend:sha-${{ github.sha }}
          build-args: VITE_API_URL=https://api.nawah-project.com
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Smoke test actual runtime with disposable CI state
        env:
          IMAGE: nawah/frontend:sha-${{ github.sha }}
        run: |
          docker run -d --name ci-runtime -e METRICS_TOKEN=ephemeral_ci_metrics_only -e NODE_ENV=production -e PORT=3000 -p 127.0.0.1:18080:3000 "$IMAGE"
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:18080/auth/login >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs ci-runtime
          exit 1
      - name: Package tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: nawah/frontend:sha-${{ github.sha }}
        run: python3 scripts/release/release.py prepare --component frontend --image "$IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: candidate-${{ github.sha }}
          path: candidate/
          overwrite: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove disposable CI container
        if: always()
        run: docker rm -f ci-runtime || true
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-${{ github.sha }}
          path: candidate
      - name: Publish unapproved candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py publish
