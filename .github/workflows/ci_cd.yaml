name: Hosted CI and release candidate
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      code: ${{ steps.plan.outputs.code }}
      ops: ${{ steps.plan.outputs.ops }}
      images: ${{ steps.plan.outputs.images }}
      schema: ${{ steps.plan.outputs.schema }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
    - name: Check conservative path classification
      run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
    - name: Plan only the required work
      id: plan
      run: python3 scripts/ci/plan.py --profile nawah-front
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24.22.2
      if: steps.plan.outputs.ops == 'true'
    - name: Check release helper syntax
      run: python3 -m py_compile scripts/release/release.py
      if: steps.plan.outputs.ops == 'true'
    - name: Keep existing frontend unit checks for operator-only edits
      if: steps.plan.outputs.ops == 'true' && (steps.plan.outputs.code != 'true')
      run: |-
        npm ci
        node --test scripts/*checks.mjs
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_API_URL: https://api.nawah-project.com
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24.22.2
        cache: npm
    - run: npm ci --include=optional
    - run: npm audit --omit=dev --audit-level=high
    - run: npm run typecheck
    - run: node --test scripts/*checks.mjs
    - name: Compile selected applications for review without packaging images
      if: needs.plan.outputs.images != 'true'
      env:
        BUILD_MATRIX: ${{ needs.plan.outputs.matrix }}
      run: |-
        for app in $(python3 -c 'import json,os; print(" ".join(x["app"] for x in json.loads(os.environ["BUILD_MATRIX"])["include"]))'); do
          NAWAH_FRONTEND_APP="$app" npm run build
        done
    needs:
    - plan
    if: needs.plan.outputs.code == 'true'
    permissions:
      contents: read
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VITE_API_URL: https://api.nawah-project.com
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Build standalone production image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        load: true
        platforms: linux/amd64
        tags: nawah/${{ matrix.component }}:sha-${{ github.sha }}
        build-args: |
          VITE_API_URL=https://api.nawah-project.com
          NAWAH_FRONTEND_APP=${{ matrix.app }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha,scope=${{ matrix.component }}
        cache-to: type=gha,mode=max,scope=${{ matrix.component }}
    - name: Smoke test actual runtime with disposable CI state
      env:
        IMAGE: nawah/${{ matrix.component }}:sha-${{ github.sha }}
      run: |
        docker run -d --name ci-runtime -e METRICS_TOKEN=ephemeral_ci_metrics_only -e NODE_ENV=production -e PORT=3000 -p 127.0.0.1:18080:3000 "$IMAGE"
        for attempt in $(seq 1 50); do
          if curl --fail --silent http://127.0.0.1:18080${{ matrix.probe }} >/dev/null; then exit 0; fi
          sleep 2
        done
        docker logs ci-runtime
        exit 1
    - name: Verify runtime security baseline
      env:
        IMAGE: nawah/${{ matrix.component }}:sha-${{ github.sha }}
      run: docker run --rm --network none --entrypoint node -v "$PWD/scripts/security:/checks:ro" "$IMAGE" /checks/runtime-checks.cjs
    - name: Package tested image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        IMAGE: nawah/${{ matrix.component }}:sha-${{ github.sha }}
      run: python3 scripts/release/release.py prepare --component "${{ matrix.component }}" --image "$IMAGE"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        name: candidate-${{ matrix.component }}-${{ github.sha }}
        path: candidate/
        overwrite: true
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
    - name: Remove disposable CI container
      if: always()
      run: docker rm -f ci-runtime || true
    needs:
    - plan
    - verify
    if: needs.plan.outputs.images == 'true'
    concurrency:
      group: image-${{ matrix.component }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
  publish:
    if: needs.plan.outputs.images == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
    - plan
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: candidate-${{ matrix.component }}-${{ github.sha }}
        path: candidate
    - name: Publish unapproved candidate without rebuilding
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/release/release.py publish
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch:
    inputs:
      full_build:
        description: Force all checks and image builds (PRs normally compile/test without packaging)
        type: boolean
        required: false
        default: false
