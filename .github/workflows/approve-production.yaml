name: Approve production
on:
  workflow_dispatch:
    inputs:
      component:
        description: Frontend component to approve
        required: true
        default: frontend
        type: choice
        options: [frontend, admin]
      candidate_tag:
        description: Exact build tag from a successful main candidate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: frontend-production-approval-${{ inputs.component }}
  cancel-in-progress: false
jobs:
  approve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Approve existing tested image
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          args=()
          python3 scripts/release/release.py approve --component "$COMPONENT" --tag "$CANDIDATE_TAG" "${args[@]}"
