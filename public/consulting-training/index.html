<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نواة — معاينة الاستشارات المهنية</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#183e35;background:#f5f4ed;line-height:1.8}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a{cursor:pointer}button{border:1px solid #b8cfc0;border-radius:10px;padding:9px 16px;background:white;color:#164a3d}button.primary{background:#165240;color:white;border-color:#165240}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #718d43;outline-offset:3px}button.selected{background:#e4eccd;border-color:#43644b}.shell{max-width:1400px;margin:auto;padding:22px}.demo{border:1px dashed #9eb5a4;border-radius:12px;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;background:#edf3e7}.demo strong{margin-inline-end:auto}.hero{background:#164b3d;color:white;border-radius:24px;padding:30px 36px;margin:25px 0}.hero p{color:#d6e6d8;max-width:750px}.hero h1{margin:8px 0;font-size:30px}.small{font-size:13px;color:#61796d}.hero .small{color:#dce8bb}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 310px;gap:22px;align-items:start}.panel{background:white;border:1px solid #cedbd0;border-radius:18px;padding:24px;min-width:0}.focus{border-inline-start:4px solid #48724c;padding:14px 20px;background:#edf4e8;border-radius:10px;margin:15px 0}.focus h3{margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:20px;border:1px solid #d3dfd3;border-radius:14px;background:#fcfdf9;min-width:0}.card h3{margin:6px 0}.card p{font-size:14px}.tag{font-size:12px;border-radius:20px;display:inline-block;padding:2px 10px;background:#e5eedf;color:#3f6442}.step{display:flex;gap:12px;border-bottom:1px solid #e1e9df;padding:12px 0}.dot{flex-shrink:0;width:27px;height:27px;border-radius:50%;background:#e8efdd;display:grid;place-items:center}.list{display:grid;gap:12px}h2{margin:0 0 15px}label{display:grid;gap:6px;margin:12px 0;font-size:14px;font-weight:bold}input,textarea,select{width:100%;border:1px solid #bccfc0;border-radius:9px;padding:10px;background:#fff;color:#183e35}textarea{min-height:100px;resize:vertical}.wide{grid-column:1/-1}.soft{background:#edf3e8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.paper{white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:30px;border:1px dashed #b1c8b2;border-radius:12px;text-align:center;color:#526c5b}.source{font-size:12px;direction:ltr;text-align:start}.private{border:1px dashed #bac9bb;padding:12px;font-size:13px;border-radius:10px}.status{min-height:26px;font-size:13px;color:#315b3a}.lead{font-size:18px}.back{border:0;background:transparent;padding:0;text-decoration:underline}aside .panel{padding:20px}aside{display:grid;gap:15px}article{scroll-margin-top:20px}@media(max-width:850px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.shell{padding:14px}.hero{padding:22px}.hero h1{font-size:24px}.panel{padding:18px}aside{order:2}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><body><div class="shell"><header class="demo"><strong id="demo-label"></strong><select id="scenario" aria-label="Training scenario" style="width:auto"><option value="direction">مريم — اتجاه مهني غير واضح</option><option value="search">عمر — البحث لا ينجح</option></select><button id="role"></button><button id="language">English</button><button id="reset"></button></header><header class="hero"><span class="small" id="eyebrow"></span><h1 id="title"></h1><p id="intro"></p></header><nav class="nav" id="nav"></nav><div id="app"></div><p id="message" role="status" aria-live="polite" class="status"></p></div><script>
let cat,ar=true,view='work',selected=null;const key='nawah.consulting.practice-preview.v1';const fresh=()=>({role:'admin',accepted:false,activity:null,activityDraft:null,answer:'',review:'',recommendation:null,decision:'',notes:'',summary:'',outcome:'',events:[]});let all=JSON.parse(localStorage.getItem(key)||'{}');let scenario='direction';let state=all[scenario]||fresh();const t=(a,e)=>ar?a:e,tx=x=>x?.[ar?'ar':'en']||'',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(message){all[scenario]=state;localStorage.setItem(key,JSON.stringify(all));if(message)document.querySelector('#message').textContent=message}function event(a,e){state.events.unshift(t(a,e));save()}function source(ids){return ids.map(id=>{let s=cat.sources.find(s=>s.id===id);return '<p class="source">'+esc(s.author+' — '+s.title+' — '+s.location)+'</p>'}).join('')}const name=()=>scenario==='direction'?t('مريم','Mariam'):t('عمر','Omar');const concern=()=>scenario==='direction'?t('مش عارفة الاتجاه المناسب ليّ، ومحتاجة فرصة دخل قريب.','I am unsure about my direction and need income soon.'):t('عارف إنّي بستهدف تصميم منتجات، لكن التقديمات مش بتوصل لمقابلات.','I target product design, but applications are not leading to interviews.');const goal=()=>scenario==='direction'?t('نستكشف اتجاهين واقعيين ونحدد خطوة قابلة للتجربة.','Explore two realistic directions and agree a testable next step.'):t('نفهم موضع التعطل من أدلة فعلية ونختار تجربة تحسين مناسبة.','Understand a bottleneck from actual evidence and choose an appropriate improvement test.');
function render(){document.documentElement.dir=ar?'rtl':'ltr';document.documentElement.lang=ar?'ar':'en';document.querySelector('#demo-label').textContent=t('معاينة تدريبية — بيانات وهمية فقط — لا اتصال ببيانات الإنتاج','Training preview — fictional data only — no production data');document.querySelector('#eyebrow').textContent=t('نواة · الاستشارات المهنية','Nawah · Career Consulting');document.querySelector('#title').textContent=state.role==='admin'?t('مساحة العمل مع ','Working with ')+name():t('استشارتي المهنية','My career consultation');document.querySelector('#intro').textContent=t('قضية واضحة، عمل متفق عليه، وتوصية لها أسبابها. تقدر تبدّل المنظور وتجرب نفس الحالة من الطرفين.','A clear concern, agreed work, and reasoned advice. Switch roles to experience both sides of the same case.');document.querySelector('#role').textContent=state.role==='admin'?t('منظور الشخص','Person’s view'):t('منظور المستشار','Consultant’s view');document.querySelector('#reset').textContent=t('إعادة المثال','Reset example');document.querySelector('#language').textContent=ar?'English':'العربية';document.querySelector('#nav').innerHTML=[['work','الحالة والعمل المشترك','Case & shared work'],['learn','تعلّم الممارسة','Learn the practice'],['library','مرجع الأنشطة','Activity reference']].filter(x=>state.role==='admin'||x[0]==='work').map(x=>'<button data-view="'+x[0]+'" class="'+(view===x[0]?'selected':'')+'">'+t(x[1],x[2])+'</button>').join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected=null;render()});if(view==='learn')return learn();if(view==='library')return library();work()}
function sidebar(){return '<aside><section class="panel"><span class="tag">'+t('بصوت الشخص','The person’s words')+'</span><p class="lead">'+esc(concern())+'</p><h3>'+t('هدف العمل الحالي','Current working goal')+'</h3><p>'+esc(goal())+'</p><p class="small">'+t('الدليل المنتظر: تفسير أوضح، مصادر مناسبة، وخطوة متفق عليها. ليس عدد المهام أو ضمان وظيفة.','Expected evidence: a clearer understanding, relevant sources, and an agreed step; not task counts or a job guarantee.')+'</p></section><section class="panel"><h3>'+t('ما حدث في الحالة','Case history')+'</h3>'+(state.events.map((e,i)=>'<div class="step"><span class="dot">'+(state.events.length-i)+'</span><span>'+esc(e)+'</span></div>').join('')||'<p class="small">'+t('ابدأ بالاتفاق على الخدمة.','Begin with the working agreement.')+'</p>')+'</section></aside>'}
function work(){const admin=state.role==='admin';let body='<div class="focus"><h3>'+t('نعمل الآن على','Working on')+'</h3><p>'+esc(goal())+'</p><span class="small">'+(!state.accepted?t('بانتظار قبول الشخص لاتفاق الخدمة','Waiting for the person to accept the service agreement'):state.answer&&!state.review?t('بانتظار مراجعتك للتسليم','Waiting for your review'):state.recommendation&&!state.decision?t('بانتظار قرار الشخص أو طلبه للتعديل','Waiting for the person’s decision or change request'):t('اتفقا على الخطوة التالية وراجعا ما أضافته','Agree the next step and review what it added'))+'</span></div>';
if(!state.accepted){body+='<article class="card"><h3>'+t('اتفاق تقديم الاستشارة','Working agreement')+'</h3><p>'+t('نستكشف الموقف ونقدم معلومات ورأيًا مهنيًا مبررًا. القرار لك، وتقدر تسأل أو تختلف أو تسحب موافقتك. ملاحظات المستشار الخاصة لا تُنشر. هذا المثال ليس مشاركة في بحث.','We explore the situation and provide information and reasoned advice. You decide and may question, disagree, or withdraw. Private notes are not published. This example is not research participation.')+'</p>'+(admin?'<p class="small">'+t('بدّل لمنظور الشخص لتجربة القبول.','Switch to the person’s view to accept.')+'</p>':'<button class="primary" id="accept">'+t('فهمت وأوافق على الخدمة','I understand and accept the service')+'</button>')+'</article>'}
else if(admin){body+='<section class="card"><div class="row between"><h3>'+t('الجلسة والعمل بين الجلسات','Session & work between sessions')+'</h3><button id="show-guide">'+t('لماذا نختار هذا العمل؟','Why choose this work?')+'</button></div><p>'+t('ارجع لما تعرفه وما يحتاج تحققًا، واختَر نشاطًا يخدم الهدف.','Review what is known and what needs checking, then choose work that serves the goal.')+'</p><label>'+t('ملاحظات خاصة — لا يراها الشخص','Private notes — not visible to the person')+'<textarea id="notes">'+esc(state.notes)+'</textarea></label><button id="save-notes">'+t('حفظ الملاحظة الخاصة','Save private note')+'</button><label>'+t('خلاصة تريد مشاركتها من الجلسة','Session summary to share')+'<textarea id="summary">'+esc(state.summary)+'</textarea></label><button id="share-summary">'+t('مشاركة الخلاصة بوضوح','Publish the shared summary')+'</button></section>';if(!state.activity)body+='<div class="actions"><button class="primary" id="choose">'+t('اختيار نشاط مناسب','Choose an appropriate activity')+'</button></div>'}
else if(state.summary)body+='<article class="card"><h3>'+t('خلاصة متفق على مشاركتها','Shared session summary')+'</h3><p class="paper">'+esc(state.summary)+'</p></article>';
if(admin&&state.activityDraft){let a=cat.activities.find(a=>a.id===state.activityDraft.id);body+='<article class="card"><span class="tag">'+t('مسودة نشاط — غير منشورة','Activity draft — not published')+'</span><h3>'+tx(a.title)+'</h3><label>'+t('لماذا اخترت هذا النشاط لهذه الحالة؟','Why this activity for this case?')+'<textarea id="activity-rationale">'+esc(state.activityDraft.rationale)+'</textarea></label><p>'+tx(a.expectedOutput)+'</p><button class="primary" id="publish-activity">'+t('نشر النشاط بعد توضيح السبب','Publish activity with this rationale')+'</button></article>';}if(state.activity){let a=cat.activities.find(a=>a.id===state.activity.id);body+='<article class="card"><span class="tag">'+t('عمل مشترك مرتبط بالهدف','Shared work linked to the goal')+'</span><h3>'+tx(a.title)+'</h3><p>'+esc(state.activity.rationale)+'</p><p><strong>'+t('المخرج المنتظر: ','Expected output: ')+'</strong>'+tx(a.expectedOutput)+'</p>';if(admin){body+=state.answer?'<div class="focus"><h4>'+t('تسليم الشخص — نسخة 1','Person’s submission — version 1')+'</h4><p class="paper">'+esc(state.answer)+'</p></div><label>'+t('مراجعة الفائدة والخطوة التالية','Review benefit and the next step')+'<textarea id="review">'+esc(state.review)+'</textarea></label><button class="primary" id="review-save">'+t('نشر مراجعة مرتبطة بهذه النسخة','Publish review for this version')+'</button>':'<p class="small">'+t('بانتظار عمل الشخص؛ إرسال النشاط لا يثبت تحقق الهدف.','Waiting for the person’s work; publishing an activity does not prove goal achievement.')+'</p>'}else{body+='<label>'+a.fields.map(f=>tx(f.label)).join(' · ')+'<textarea id="answer">'+esc(state.answer)+'</textarea></label><button class="primary" id="submit">'+t('تسليم هذه النسخة للمراجعة','Submit this version for review')+'</button>';if(state.review)body+='<div class="focus"><h4>'+t('مراجعة المستشار','Consultant’s review')+'</h4><p class="paper">'+esc(state.review)+'</p></div>'}body+='</article>'}
if(state.accepted&&admin){body+='<article class="card"><h3>'+t('توصية لها أسباب وحدود','Advice with reasons and limitations')+'</h3><p class="small">'+t('يمكن أن تكون التوصية تجربة صغيرة أو جمع معلومة قبل قرار أكبر.','Advice may be a small experiment or further information before a larger decision.')+'</p><label>'+t('التوصية والأسباب والبدائل وما لم يُحسم','Recommendation, reasons, alternatives, and uncertainties')+'<textarea id="recommend">'+esc(state.recommendation||'')+'</textarea></label><button class="primary" id="publish-recommendation">'+t('نشر التوصية للشخص','Publish recommendation')+'</button>'+(state.decision?'<div class="focus">'+t('قرار الشخص: ','Person’s decision: ')+esc(state.decision)+'</div>':'')+'<label>'+t('مراجعة قبل / الآن وخطوات مستقبلية','Before/now review and future steps')+'<textarea id="outcome">'+esc(state.outcome)+'</textarea></label><button id="close">'+t('حفظ خلاصة المراجعة','Save the outcome review')+'</button></article>'}else if(state.recommendation){body+='<article class="card"><h3>'+t('التوصية المهنية — القرار لك','Professional recommendation — you decide')+'</h3><p class="paper">'+esc(state.recommendation)+'</p><label>'+t('اختيارك أو سؤالك أو التعديل المطلوب','Your choice, question, or requested change')+'<textarea id="decision">'+esc(state.decision)+'</textarea></label><button class="primary" id="decide">'+t('مشاركة رأيي وقراري','Share my view and decision')+'</button></article>'}
if(!admin&&state.outcome)body+='<article class="card soft"><h3>'+t('ما تعلمناه وما يلي','Learning and next steps')+'</h3><p class="paper">'+esc(state.outcome)+'</p></article>';
document.querySelector('#app').innerHTML='<div class="grid"><section class="panel">'+body+'</section>'+sidebar()+'</div>';bind('publish-activity',()=>{state.activity={...state.activityDraft,rationale:document.querySelector('#activity-rationale').value};state.activityDraft=null;state.answer='';state.review='';event('نُشر نشاط بسبب ومخرج متوقع','Activity published with rationale and expected output');render()});bind('accept',()=>{state.accepted=true;event('قبل الشخص اتفاق الخدمة','Person accepted service agreement');render()});bind('save-notes',()=>{state.notes=document.querySelector('#notes').value;save(t('حُفظت ملاحظة خاصة في المعاينة فقط','Private preview note saved'))});bind('share-summary',()=>{state.summary=document.querySelector('#summary').value;event('نُشرت خلاصة جلسة دون الملاحظات الخاصة','Session summary published without private notes');render()});bind('show-guide',()=>{selected='choose-intervention';view='learn';render()});bind('choose',()=>{view='library';render()});bind('submit',()=>{state.answer=document.querySelector('#answer').value;if(!state.answer.trim())return;event('سُلّم نشاط للمراجعة — لا تغيير في رحلة نواة','Work submitted for review — no Journey change');render()});bind('review-save',()=>{state.review=document.querySelector('#review').value;event('نُشرت مراجعة للتسليم','Submission review published');render()});bind('publish-recommendation',()=>{state.recommendation=document.querySelector('#recommend').value;if(!state.recommendation.trim())return;event('نُشرت توصية مبررة لقرار الشخص','Reasoned advice published for the person’s decision');render()});bind('decide',()=>{state.decision=document.querySelector('#decision').value;event('شارك الشخص رأيه في التوصية','Person responded to recommendation');render()});bind('close',()=>{state.outcome=document.querySelector('#outcome').value;event('حُفظت مراجعة الفائدة والخطوات المستقبلية','Outcome and future steps recorded');render()})}
function bind(id,fn){let e=document.getElementById(id);if(e)e.onclick=fn}
function learn(){let l=cat.lessons.find(l=>l.id===selected);document.querySelector('#app').innerHTML=l?'<article class="panel"><button class="back" id="back">'+t('العودة للعمل في الحالة','Return to the case')+'</button><span class="tag">'+t('مرجع ممارسة أثناء العمل','Practice reference')+'</span><h2>'+tx(l.title)+'</h2><p class="lead">'+tx(l.goal)+'</p>'+l.body.map(p=>'<p>'+tx(p)+'</p>').join('')+'<div class="focus">'+tx(l.example)+'</div><h3>'+t('تمرين للمستشار','Practitioner exercise')+'</h3>'+l.exercise.map(p=>'<p>• '+tx(p)+'</p>').join('')+'<h3>'+t('أخطاء شائعة','Common pitfalls')+'</h3>'+l.pitfalls.map(p=>'<p>• '+tx(p)+'</p>').join('')+source(l.sources)+'</article>':'<section class="panel"><h2>'+t('تعلم الممارسة قبل وأثناء العمل','Learn before and during practice')+'</h2><p>'+t('دليل أصلي مع أمثلة وتمارين ومراجع. استخدمه لفهم قرارات العمل؛ ليس اختبار تأهيل مهني.','Original explanations, cases, exercises, and references. Use it to understand practice decisions; it is not a qualification test.')+'</p><div class="cards">'+cat.lessons.map((l,i)=>'<article class="card"><span class="tag">0'+(i+1)+'</span><h3>'+tx(l.title)+'</h3><p>'+tx(l.goal)+'</p><button data-lesson="'+l.id+'">'+t('قراءة وتجربة','Read and practise')+'</button></article>').join('')+'</div></section>';document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{selected=b.dataset.lesson;render()});bind('back',()=>{view='work';render()})}
function library(){document.querySelector('#app').innerHTML='<section class="panel"><button class="back" id="back">'+t('العودة للحالة','Return to the case')+'</button><h2>'+t('اختر عملًا يخدم الاحتياج الحالي','Choose work for the current need')+'</h2><p>'+t('راجع سبب الملاءمة والحدود، وعدّل النشاط مع الشخص. لا يوجد ترتيب إلزامي للأنشطة.','Consider fit and limitations, and adapt work with the person. Activities have no mandatory order.')+'</p><div class="cards">'+cat.activities.map(a=>'<article class="card"><h3>'+tx(a.title)+'</h3><p>'+tx(a.purpose)+'</p><p><strong>'+t('متى يفيد: ','Useful when: ')+'</strong>'+tx(a.indications)+'</p><p class="small">'+tx(a.avoid)+'</p><p>'+tx(a.expectedOutput)+'</p>'+source(a.sources)+(state.accepted?'<button class="primary" data-activity="'+a.id+'">'+t('تكييف النشاط ونشره للحالة','Adapt and publish for this case')+'</button>':'<span class="small">'+t('متاح للعمل بعد قبول اتفاق الخدمة','Available after service acceptance')+'</span>')+'</article>').join('')+'</div></section>';document.querySelectorAll('[data-activity]').forEach(b=>b.onclick=()=>{let a=cat.activities.find(a=>a.id===b.dataset.activity);state.activityDraft={id:a.id,rationale:tx(a.purpose)+' — '+goal()};state.answer='';state.review='';event('اختير نشاط لهدف الحالة: '+tx(a.title),'Activity selected for the goal: '+tx(a.title));view='work';render()});bind('back',()=>{view='work';render()})}
document.querySelector('#scenario').onchange=e=>{save();scenario=e.target.value;state=all[scenario]||fresh();selected=null;view='work';render()};document.querySelector('#role').onclick=()=>{state.role=state.role==='admin'?'member':'admin';view='work';save();render()};document.querySelector('#language').onclick=()=>{ar=!ar;render()};document.querySelector('#reset').onclick=()=>{state=fresh();save();view='work';selected=null;render()};fetch('catalog.json').then(r=>r.json()).then(c=>{cat=c;render()});
</script></body></html>
